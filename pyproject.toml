[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aclib-import-mcp"
dynamic = ["version"]
description = "MCP server for the ACLib Import Wizard automation API (import AccessCodeLib modules into Microsoft Access databases)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Josef Pötzl"}
]
keywords = ["mcp", "access", "msaccess", "vba", "accesscodelib", "aclib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/AccessCodeLib/ACLibImportWizard-MCP"
Repository = "https://github.com/AccessCodeLib/ACLibImportWizard-MCP"
Issues = "https://github.com/AccessCodeLib/ACLibImportWizard-MCP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6",
]

[project.scripts]
aclib-import-mcp = "aclib_import_mcp.server:main"

[tool.setuptools.dynamic]
version = {attr = "aclib_import_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "integration: marks tests as integration tests (require Access installed)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit selection, independent of the defaults of the installed ruff version.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM"]
